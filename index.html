<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tarot Club | نادي التاروت</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#07090d;
    color:#d8dde2;
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-10;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            rgba(120,128,136,.10),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 20% 80%,
            rgba(90,98,106,.08),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #07090d,
            #0a0d12
        );
}


/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    min-height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    padding:10px 5%;

    background:
        rgba(6,8,12,.94);

    border-bottom:
        1px solid rgba(180,185,190,.10);

    backdrop-filter:blur(14px);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    color:#e1e5e8;
    text-decoration:none;

    white-space:nowrap;
}

.logo-symbol{
    width:40px;
    height:40px;

    border:
        1px solid rgba(180,187,194,.35);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#b9c0c6;

    position:relative;

    font-size:20px;
}

.logo-symbol::before{
    content:"";

    position:absolute;

    inset:6px;

    border:
        1px solid rgba(180,187,194,.18);

    border-radius:50%;
}

.logo-text{
    font-size:21px;
    font-weight:600;
    letter-spacing:.5px;
}

nav{
    display:flex;
    align-items:center;
    gap:3px;
}

nav button{
    border:none;
    background:transparent;

    color:#7f8891;

    padding:10px 13px;

    border-radius:4px;

    cursor:pointer;

    font-size:13px;

    transition:.2s;
}

nav button:hover{
    color:#e0e4e7;
    background:rgba(160,170,180,.07);
}

nav button.active{
    color:#e1e5e8;
    background:rgba(150,160,170,.10);
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    position:relative;
    width:220px;
}

.search-box input{
    width:100%;
    height:39px;

    padding:
        0 40px
        0 13px;

    border:
        1px solid rgba(160,170,180,.13);

    border-radius:4px;

    outline:none;

    color:#e0e4e7;

    background:#10141a;

    font-size:12px;
}

.search-box input::placeholder{
    color:#68717a;
}

.search-box input:focus{
    border-color:
        rgba(170,180,190,.30);

    box-shadow:
        0 0 20px rgba(150,160,170,.05);
}

.search-icon{
    position:absolute;

    right:13px;
    top:50%;

    transform:translateY(-50%);

    color:#7c858e;

    font-size:18px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    min-height:650px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            180deg,
            #080b10 0%,
            #0a0e14 60%,
            #11161c 100%
        );
}


/* =========================================================
   DISTANT LIGHT
========================================================= */

.hero-light{
    position:absolute;

    width:700px;
    height:400px;

    left:50%;
    top:100px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(175,182,188,.09),
            transparent 65%
        );

    filter:blur(25px);

    z-index:0;
}


/* =========================================================
   PALACE
========================================================= */

.palace{
    position:absolute;

    left:50%;
    bottom:30px;

    width:900px;
    height:510px;

    transform:translateX(-50%);

    z-index:1;

    opacity:.82;

    pointer-events:none;
}

.palace svg{
    width:100%;
    height:100%;

    display:block;
}


/* =========================================================
   PALACE FOG
========================================================= */

.fog{
    position:absolute;

    left:-10%;
    right:-10%;

    bottom:-70px;

    height:250px;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 20% 50%,
            rgba(175,180,184,.20),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 50% 45%,
            rgba(185,189,192,.17),
            transparent 40%
        ),
        radial-gradient(
            ellipse at 80% 55%,
            rgba(170,176,181,.19),
            transparent 38%
        );

    filter:blur(25px);

    animation:fogMove 12s ease-in-out infinite alternate;
}

@keyframes fogMove{

    from{
        transform:translateX(-30px);
    }

    to{
        transform:translateX(30px);
    }

}


/* second fog layer */

.fog-two{
    position:absolute;

    left:-20%;
    right:-20%;

    bottom:30px;

    height:110px;

    z-index:4;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(160,166,172,.08),
            transparent
        );

    filter:blur(20px);

    animation:fogMoveTwo 16s ease-in-out infinite alternate;
}

@keyframes fogMoveTwo{

    from{
        transform:translateX(40px);
    }

    to{
        transform:translateX(-40px);
    }

}


/* =========================================================
   HERO CONTENT
========================================================= */

.hero-content{
    position:relative;

    z-index:10;

    width:min(800px,90%);

    margin-top:-25px;

    text-shadow:
        0 3px 20px rgba(0,0,0,.8);
}

.symbol{
    width:80px;
    height:80px;

    margin:0 auto 20px;

    border:
        1px solid rgba(185,190,195,.25);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    color:#c1c7cc;

    font-size:27px;

    background:
        rgba(8,11,15,.40);

    box-shadow:
        0 0 35px rgba(150,160,170,.07);
}

.symbol::before{
    content:"";

    position:absolute;

    width:55px;
    height:55px;

    border:
        1px solid rgba(190,195,200,.15);

    transform:rotate(45deg);
}

.symbol::after{
    content:"";

    position:absolute;

    width:18px;
    height:18px;

    border:
        1px solid rgba(190,195,200,.20);

    transform:rotate(45deg);
}

.eyebrow{
    color:#8b949d;

    font-size:11px;

    letter-spacing:4px;

    margin-bottom:15px;
}

.hero h1{
    font-size:
        clamp(42px,7vw,76px);

    font-weight:400;

    color:#e7eaed;

    letter-spacing:2px;

    margin-bottom:15px;
}

.hero h1 span{
    color:#aeb8c1;
}

.hero-description{
    width:min(650px,100%);

    margin:0 auto 28px;

    color:#929ba4;

    line-height:2;

    font-size:14px;
}

.hero-buttons{
    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;
}

.btn{
    border-radius:4px;

    padding:12px 25px;

    cursor:pointer;

    font-size:13px;

    transition:.2s;
}

.btn-primary{
    border:
        1px solid rgba(175,185,195,.28);

    color:#e4e8eb;

    background:
        linear-gradient(
            135deg,
            rgba(75,84,94,.55),
            rgba(32,38,45,.75)
        );
}

.btn-primary:hover{
    background:
        linear-gradient(
            135deg,
            rgba(100,110,120,.60),
            rgba(42,49,57,.80)
        );

    transform:translateY(-2px);
}

.btn-secondary{
    border:
        1px solid rgba(150,160,170,.15);

    color:#9da6ae;

    background:
        rgba(8,11,15,.70);
}

.btn-secondary:hover{
    color:#e0e4e7;

    border-color:
        rgba(170,180,190,.28);
}


/* =========================================================
   MAIN
========================================================= */

.container{
    width:min(1200px,92%);

    margin:auto;
}


/* =========================================================
   SECTION
========================================================= */

.section{
    padding:60px 0 15px;
}

.section-header{
    display:flex;

    align-items:flex-end;
    justify-content:space-between;

    margin-bottom:22px;

    padding-bottom:14px;

    border-bottom:
        1px solid rgba(160,170,180,.10);
}

.section-title{
    font-size:23px;

    font-weight:500;

    color:#dce1e5;
}

.section-subtitle{
    color:#606a73;

    font-size:10px;

    letter-spacing:3px;

    margin-top:6px;
}

.section-action{
    border:none;
    background:none;

    color:#78838d;

    cursor:pointer;

    font-size:12px;
}

.section-action:hover{
    color:#d3d9de;
}


/* =========================================================
   CATEGORIES
========================================================= */

.categories{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:5px;
}

.categories::-webkit-scrollbar{
    height:3px;
}

.categories::-webkit-scrollbar-thumb{
    background:#30373e;
}

.category{
    flex-shrink:0;

    border:
        1px solid rgba(150,160,170,.12);

    border-radius:3px;

    background:#0d1116;

    color:#7d8790;

    padding:9px 15px;

    cursor:pointer;

    font-size:12px;

    transition:.2s;
}

.category:hover{
    color:#d9dee2;

    border-color:
        rgba(170,180,190,.25);
}

.category.active{
    color:#e1e5e8;

    background:#1a2027;

    border-color:
        rgba(180,190,200,.25);
}


/* =========================================================
   LIBRARY
========================================================= */

.library-count{
    color:#606a73;

    font-size:11px;

    margin-top:6px;
}

.books-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px,1fr)
        );

    gap:20px;
}


/* =========================================================
   BOOK CARD
========================================================= */

.book-card{
    position:relative;

    overflow:hidden;

    background:#0d1117;

    border:
        1px solid rgba(145,155,165,.11);

    border-radius:4px;

    cursor:pointer;

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}

.book-card:hover{
    transform:translateY(-5px);

    border-color:
        rgba(170,180,190,.27);

    box-shadow:
        0 18px 45px rgba(0,0,0,.40);
}

.cover{
    height:260px;

    position:relative;

    overflow:hidden;

    background:#161b21;
}

.cover img{
    width:100%;
    height:100%;

    object-fit:cover;

    filter:
        grayscale(.35)
        brightness(.72)
        contrast(1.05);

    transition:.35s;
}

.book-card:hover .cover img{
    transform:scale(1.04);

    filter:
        grayscale(.20)
        brightness(.82);
}

.cover::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent 45%,
            rgba(5,7,10,.90)
        );
}

.card-symbol{
    position:absolute;

    left:10px;
    top:10px;

    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid rgba(200,205,210,.20);

    border-radius:50%;

    color:#c0c6cb;

    background:
        rgba(5,8,11,.65);

    z-index:5;
}

.favorite{
    position:absolute;

    right:10px;
    top:10px;

    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid rgba(200,205,210,.16);

    border-radius:50%;

    background:
        rgba(5,8,11,.70);

    color:#87919a;

    cursor:pointer;

    z-index:6;

    font-size:16px;
}

.favorite:hover{
    color:#e1e5e8;
}

.favorite.active{
    color:#dce2e7;

    border-color:
        rgba(180,190,200,.35);

    background:#252c33;
}

.status{
    position:absolute;

    left:10px;
    bottom:10px;

    z-index:5;

    color:#abb3ba;

    background:
        rgba(5,7,10,.78);

    border:
        1px solid rgba(170,180,190,.13);

    padding:4px 7px;

    font-size:9px;
}

.book-info{
    padding:13px;
}

.book-title{
    color:#dce1e5;

    font-size:14px;

    font-weight:600;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:6px;
}

.book-author{
    color:#6f7982;

    font-size:10px;

    margin-bottom:11px;
}

.tags{
    display:flex;

    flex-wrap:wrap;

    gap:5px;
}

.tag{
    color:#7c8790;

    font-size:9px;

    padding:4px 6px;

    border:
        1px solid rgba(150,160,170,.10);

    background:#11161c;

    border-radius:2px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:80px 20px;

    color:#626c75;
}

.empty-icon{
    font-size:40px;

    margin-bottom:12px;

    opacity:.5;
}


/* =========================================================
   MODAL
========================================================= */

.overlay{
    position:fixed;

    inset:0;

    z-index:2000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(2,4,7,.86);

    backdrop-filter:blur(12px);
}

.overlay.show{
    display:flex;
}

.modal{
    width:min(850px,100%);

    max-height:90vh;

    overflow-y:auto;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #151a20,
            #090d12
        );

    border:
        1px solid rgba(170,180,190,.17);

    border-radius:5px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);
}

.close{
    position:absolute;

    left:15px;
    top:15px;

    width:35px;
    height:35px;

    border:
        1px solid rgba(180,190,200,.15);

    border-radius:50%;

    background:#090d12;

    color:#8b959e;

    cursor:pointer;

    z-index:10;

    font-size:20px;
}

.close:hover{
    color:#e1e5e8;
}

.modal-content{
    display:grid;

    grid-template-columns:240px 1fr;

    gap:30px;

    padding:35px;
}

.modal-cover{
    height:350px;

    overflow:hidden;

    border:
        1px solid rgba(160,170,180,.15);

    background:#080b0f;
}

.modal-cover img{
    width:100%;
    height:100%;

    object-fit:cover;

    filter:
        grayscale(.25)
        brightness(.72);
}

.modal-info h2{
    color:#e4e8eb;

    font-size:29px;

    font-weight:500;

    margin-bottom:7px;
}

.modal-author{
    color:#727c85;

    font-size:12px;

    margin-bottom:20px;
}

.modal-description{
    color:#969fa7;

    font-size:13px;

    line-height:2;

    margin:20px 0;
}

.meta{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin:20px 0;
}

.meta-box{
    padding:11px;

    border:
        1px solid rgba(150,160,170,.10);

    background:#0d1217;
}

.meta-box span{
    display:block;

    color:#626d76;

    font-size:9px;

    margin-bottom:5px;
}

.meta-box strong{
    color:#cdd4d9;

    font-size:13px;
}

.modal-tags{
    display:flex;

    flex-wrap:wrap;

    gap:6px;
}

.read-button{
    border:
        1px solid rgba(175,185,195,.27);

    background:#1c232a;

    color:#e0e5e9;

    padding:12px 25px;

    border-radius:3px;

    cursor:pointer;
}

.read-button:hover{
    background:#272f37;
}

.unavailable{
    color:#737d86;

    font-size:12px;

    padding-top:5px;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    margin-top:80px;

    padding:40px 20px;

    text-align:center;

    color:#555f68;

    font-size:11px;

    border-top:
        1px solid rgba(150,160,170,.08);

    background:#06080c;
}

.footer-symbol{
    color:#818b94;

    font-size:23px;

    margin-bottom:10px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    header{
        flex-wrap:wrap;
    }

    nav{
        order:3;

        width:100%;

        overflow-x:auto;

        justify-content:flex-start;
    }

    nav button{
        flex-shrink:0;
    }

    .search-box{
        width:180px;
    }

    .palace{
        width:850px;

        transform:
            translateX(-50%)
            scale(.85);

        transform-origin:
            center bottom;
    }

    .hero{
        min-height:600px;
    }

}


@media(max-width:600px){

    header{
        padding:10px 4%;
    }

    .logo-text{
        font-size:18px;
    }

    .search-box{
        width:150px;
    }

    .hero{
        min-height:570px;
    }

    .palace{
        width:800px;

        transform:
            translateX(-50%)
            scale(.65);

        transform-origin:
            center bottom;

        bottom:15px;
    }

    .hero h1{
        font-size:42px;
    }

    .hero-description{
        font-size:12px;
    }

    .books-grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:12px;
    }

    .cover{
        height:215px;
    }

    .book-info{
        padding:10px;
    }

    .book-title{
        font-size:12px;
    }

    .modal-content{
        grid-template-columns:1fr;

        padding:25px;
    }

    .modal-cover{
        width:180px;
        height:270px;

        margin:auto;
    }

    .meta{
        grid-template-columns:1fr;
    }

}


@media(max-width:400px){

    .search-box{
        width:135px;
    }

    .palace{
        transform:
            translateX(-50%)
            scale(.55);
    }

    .hero h1{
        font-size:36px;
    }

    .cover{
        height:190px;
    }

}

</style>
</head>


<body>


<!-- ======================================================
     HEADER
====================================================== -->

<header>

    <a
        href="#"
        class="logo"
        onclick="showHome();return false;"
    >

        <div class="logo-symbol">
            ✦
        </div>

        <div class="logo-text">
            Tarot Club
        </div>

    </a>


    <nav>

        <button
            class="active"
            onclick="showHome(this)"

            الرئيسية
        </button>

        <button

        </button>

        <button

        </button>

        <button

        </button>

    <div class="search-box">

        <input

            oninput="searchBooks()"
        >

    </div>

</header>



<!-- ======================================================
     HERO
====================================================== -->

<section class="hero">

    <div class="hero-light"></div>


    <!-- ==================================================
         GIANT PALACE
    ================================================== -->

    <div class="palace">

        <svg
            viewBox="0 0 900 510"
            xmlns="http://www.w3.org/2000/svg"
        >

            <!-- central structure -->

            <path

                L350 170

                "

            />


            <!-- left tower -->

            <rect
                x="105"

            />

            <path
                d="
                M85 215
                L157 100
                L230 215
                Z
                "
                fill="#121920"
            />


            <!-- right tower -->

            <rect
                x="690"
                y="215"
                width="105"
                height="295"
                fill="#0d1319"
            />

            <path
                d="
                M670 215
                L742 100
                L815 215
                Z
                "
                fill="#121920"
            />


            <!-- central roof -->

            <path
                d="
                M300 180
                L450 45
                L600 180
                Z
                "
                fill="#1b232c"
            />


            <!-- central peak -->

/* =========================================================
   RENDER
========================================================= */

function render(list){

    currentBooks = [...list];

    const grid =
        document.getElementById("booksGrid");

    const count =
        document.getElementById("libraryCount");


    count.textContent =
        `${list.length} رواية`;


    if(list.length === 0){

        grid.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ☁
                </div>

                لا توجد روايات في هذا الجزء من الأرشيف.

            </div>
        `;

        return;
    }


    grid.innerHTML =
        list.map(book => {

            const isFavorite =
                favorites.includes(book.id);


            return `

                <article
                    class="book-card"
                    onclick="openDetails(${book.id})"
                >

                    <div class="cover">

                        <img
                            src="${book.cover}"
                            alt="${book.ar}"
                            loading="lazy"
                        >

                        <div class="card-symbol">
                            ✦
                        </div>


                        <button
                            class="favorite ${isFavorite ? "active" : ""}"
                            onclick="toggleFavorite(event,${book.id})"
                            aria-label="المفضلة"
                        >
                            ${isFavorite ? "★" : "☆"}
                        </button>


                        <div class="status">
                            ${book.status}

                    <div class="book-info">

                                    `<span class="tag">${cat}</span>`
                                )
                                .join("")
                            }

                        </div>

                    </div>

                </article>

            `;

        }).join("");
}


/* =========================================================
   DETAILS
========================================================= */

function openDetails(id){

    const book =
        books.find(
            item => item.id === id
        );

    if(!book) return;


    const overlay =
        document.getElementById(
            "detailsOverlay"
        );


    const modal =
        document.getElementById(
            "modalContent"
        );


    modal.innerHTML = `

        <div class="modal-cover">

            <img
                src="${book.cover}"
                alt="${book.ar}"
            >

        </div>


        <div class="modal-info">

            <h2>
                ${book.ar}
            </h2>


            <div class="modal-author">
                ${book.title}
                — ${book.author}
            </div>


            <div class="modal-tags">

                ${book.categories
                    .map(
                        cat =>
                        `<span class="tag">${cat}</span>`
                    )
                    .join("")
                }

            </div>


            <div class="meta">

                <div class="meta-box">

                    <span>
                        التقييم
                    </span>

                    <strong>
                        ★ ${book.rating}
                    </strong>

                </div>


                <div class="meta-box">

                    <span>
                        المشاهدات
                    </span>

                    <strong>
                        ${formatNumber(book.views)}
                    </strong>

                </div>


                <div class="meta-box">

                    <span>
                        الفصول
                    </span>

                    <strong>
                        ${
                            book.chapters === 0
                            ? "غير متوفرة"
                            : book.chapters
                        }
                    </strong>

                </div>

            </div>


            <p class="modal-description">
                ${book.description}
            </p>


            ${
                book.chapters > 0

                ?

                `
                    <button
                        class="read-button"
                        onclick="startReading(${book.id})"
                    >
                        دخول الرواية
                    </button>
                `

                :

                `
                    <div class="unavailable">
                        هذه الرواية موجودة في الأرشيف،
                        لكن لم تتم إضافة فصولها بعد.
                    </div>
                `
            }

        </div>

    `;


    overlay.classList.add("show");

    document.body.style.overflow =
        "hidden";
}


/* =========================================================
   CLOSE
========================================================= */

function closeDetails(){

    document
        .getElementById("detailsOverlay")
        .classList.remove("show");

    document.body.style.overflow =
        "";
}


document
    .getElementById("detailsOverlay")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeDetails();

            }

        }
    );


/* =========================================================
   FAVORITE
========================================================= */

function toggleFavorite(event,id){

    event.stopPropagation();


    if(favorites.includes(id)){

        favorites =
            favorites.filter(
                item => item !== id
            );

    }
    else{

        favorites.push(id);

    }


    localStorage.setItem(
        "tarotFavorites",
        JSON.stringify(favorites)
    );


    render(currentBooks);
}


/* =========================================================
   FAVORITES
========================================================= */

function showFavorites(button){

    setActive(button);


    const result =
        books.filter(
            book =>
                favorites.includes(book.id)
        );


    render(result);

    scrollToLibrary();
}


/* =========================================================
   SEARCH
========================================================= */

function searchBooks(){

    const query =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    if(!query){

        render(books);

        return;
    }


    const result =
        books.filter(book => {

            return (

                book.title
                    .toLowerCase()
                    .includes(query)

                ||

                book.ar
                    .toLowerCase()
                    .includes(query)

                ||

                book.author
                    .toLowerCase()
                    .includes(query)

                ||

                book.categories.some(
                    category =>
                        category
                            .toLowerCase()
                            .includes(query)
                )

            );

        });


    render(result);

    scrollToLibrary();
}


/* =========================================================
   CATEGORY
========================================================= */

function filterCategory(
    category,
    button
){

    document
        .querySelectorAll(".category")
        .forEach(
            item =>
                item.classList.remove("active")
        );


    button.classList.add("active");


    if(category === "الكل"){

        render(books);

        return;
    }


    const result =
        books.filter(
            book =>
                book.categories
                    .includes(category)
        );


    render(result);

    scrollToLibrary();
}


/* =========================================================
   POPULAR
========================================================= */

function showPopular(button){

    if(button){

        setActive(button);

    }


    const result =
        [...books].sort(
            (a,b) =>
                b.views - a.views
        );


    render(result);

    scrollToLibrary();
}


/* =========================================================
   TOP RATED
========================================================= */

function showTopRated(button){

    if(button){

        setActive(button);

    }


    const result =
        [...books].sort(
            (a,b) =>
                b.rating - a.rating
        );


    render(result);

    scrollToLibrary();
}

========================================================= */

    if(button){

        setActive(button);

    render(books);

========================================================= */

/* =========================================================
   ACTIVE NAV
========================================================= */

function setActive(button){

    document
        .querySelectorAll("nav button")
        .forEach(
            item =>
                item.classList.remove("active")
        );


    if(button){

        button.classList.add("active");

    }
}

========================================================= */

function scrollToCategories(){

    document

            behavior:"smooth"

/* =========================================================

========================================================= */

function scrollToLibrary(){

/* =========================================================
   READING
========================================================= */

function startReading(id){

    const book =
        books.find(
            item => item.id === id
        );


    if(!book || book.chapters === 0){

        return;
    }


    alert(
        `سيتم فتح "${book.ar}" بعد إضافة ملفات الفصول إلى الموقع.`
    );
}


/* =========================================================
   FORMAT NUMBERS
========================================================= */

function formatNumber(number){

    if(number >= 1000000){

        return (
            (number / 1000000)
                .toFixed(1)
                .replace(".0","")
            + "M"
        );

    }


    if(number >= 1000){

        return (
            (number / 1000)
                .toFixed(1)
                .replace(".0","")
            + "K"
        );

    }


    return number;
}


/* =========================================================
   INITIALIZE
========================================================= */

render(books);
