<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tarot Club — نادي التاروت</title>

<style>
/* =========================================================
   TAROT CLUB — GREY FOG / GIANT PALACE
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            ellipse at 50% 15%,
            rgba(92,108,124,.12),
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #070a0f 0%,
            #0a0e14 45%,
            #080b10 100%
        );

    color:#d8dde2;
    min-height:100vh;
    overflow-x:hidden;
}

/* ---------------------------------------------------------
   FOG
--------------------------------------------------------- */

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    pointer-events:none;
    z-index:-3;

    background:
        radial-gradient(
            ellipse at 20% 40%,
            rgba(142,151,161,.08),
            transparent 28%
        ),
        radial-gradient(
            ellipse at 80% 60%,
            rgba(105,116,128,.07),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 50% 85%,
            rgba(160,168,177,.08),
            transparent 25%
        );

    filter:blur(55px);
    animation:fogMove 22s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:fixed;
    left:-10%;
    right:-10%;
    bottom:-90px;
    height:260px;
    pointer-events:none;
    z-index:50;

    background:
        linear-gradient(
            to top,
            rgba(174,181,188,.08),
            rgba(120,130,140,.035),
            transparent
        );

    filter:blur(28px);
}

@keyframes fogMove{
    from{
        transform:translate3d(-3%,0,0) scale(1);
    }
    to{
        transform:translate3d(3%,2%,0) scale(1.06);
    }
}

/* ---------------------------------------------------------
   HEADER
--------------------------------------------------------- */

header{
    position:sticky;
    top:0;
    z-index:100;

    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    background:
        linear-gradient(
            180deg,
            rgba(6,9,14,.96),
            rgba(8,11,16,.91)
        );

    border-bottom:1px solid rgba(148,158,168,.12);

    backdrop-filter:blur(16px);
}

/* subtle mystical line */

header::after{
    content:"";
    position:absolute;
    bottom:-1px;
    left:20%;
    right:20%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(123,143,163,.35),
            transparent
        );
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    color:#e3e7ea;
    text-decoration:none;

    font-size:22px;
    font-weight:700;
    letter-spacing:.5px;
}

.logo-symbol{
    width:39px;
    height:39px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(144,160,177,.45);
    border-radius:50%;

    color:#aab8c5;
    font-size:20px;

    box-shadow:
        0 0 18px rgba(100,120,140,.12),
        inset 0 0 12px rgba(120,140,160,.05);

    position:relative;
}

.logo-symbol::before{
    content:"";
    position:absolute;
    inset:5px;

    border:1px solid rgba(160,170,180,.18);
    border-radius:50%;
}

nav{
    display:flex;
    align-items:center;
    gap:5px;
}

nav button{
    border:none;
    background:transparent;

    color:#8f99a3;

    padding:10px 14px;

    border-radius:5px;

    cursor:pointer;

    font-size:14px;

    transition:
        color .2s,
        background .2s,
        transform .2s;
}

nav button:hover{
    color:#dbe1e6;
    background:rgba(125,142,158,.08);
}

nav button.active{
    color:#e2e7eb;
    background:rgba(115,132,149,.10);
}

/* ---------------------------------------------------------
   SEARCH
--------------------------------------------------------- */

.search{
    position:relative;
    width:230px;
}

.search input{
    width:100%;
    height:39px;

    padding:0 42px 0 14px;

    border:1px solid rgba(135,148,160,.14);
    border-radius:5px;

    outline:none;

    background:rgba(16,21,28,.78);
    color:#e1e5e8;

    font-size:13px;

    transition:.25s;
}

.search input::placeholder{
    color:#68727d;
}

.search input:focus{
    border-color:rgba(137,157,177,.35);

    box-shadow:
        0 0 20px rgba(83,105,126,.08);
}

.search-icon{
    position:absolute;
    right:14px;
    top:50%;

    transform:translateY(-50%);

    color:#76828e;
}

/* ---------------------------------------------------------
   HERO
--------------------------------------------------------- */

.hero{
    min-height:620px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    isolation:isolate;

    background:
        radial-gradient(
            ellipse at 50% 55%,
            rgba(70,83,97,.15),
            transparent 50%
        ),
        linear-gradient(
            180deg,
            #080b10,
            #0b1017 65%,
            #111820
        );
}

/* stars / dust */

.hero::before{
    content:"";
    position:absolute;
    inset:0;

    opacity:.35;

    background-image:
        radial-gradient(circle, rgba(220,225,230,.35) 1px, transparent 1px);

    background-size:87px 87px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 72%
        );

    z-index:-4;
}

/* ---------------------------------------------------------
   GIANT PALACE
--------------------------------------------------------- */

.palace{
    position:absolute;

    left:50%;
    bottom:-10px;

    transform:translateX(-50%);

    width:min(1100px,100vw);
    height:520px;

    z-index:-2;

    opacity:.72;
}

/* palace base */

.palace .building{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:610px;
    height:360px;

    background:
        linear-gradient(
            90deg,
            #0b1016,
            #1a222c 48%,
            #0a0f15
        );

    clip-path:polygon(
        9% 100%,
        9% 34%,
        18% 34%,
        18% 20%,
        27% 20%,
        27% 8%,
        50% 0%,
        73% 8%,
        73% 20%,
        82% 20%,
        82% 34%,
        91% 34%,
        91% 100%
    );

    box-shadow:
        0 0 100px rgba(103,119,135,.10);
}

/* side towers */

.palace .tower{
    position:absolute;
    bottom:0;

    width:120px;
    height:330px;

    background:
        linear-gradient(
            90deg,
            #080d13,
            #17202a,
            #080d13
        );
}

.palace .tower.left{
    left:9%;
}

.palace .tower.right{
    right:9%;
}

.palace .tower::before{
    content:"";

    position:absolute;

    left:-20px;
    right:-20px;
    top:-70px;

    height:100px;

    background:#111923;

    clip-path:polygon(
        50% 0,
        100% 100%,
        0 100%
    );
}

.palace .tower::after{
    content:"";

    position:absolute;

    top:55px;
    left:50%;

    width:25px;
    height:90px;

    transform:translateX(-50%);

    border-radius:14px 14px 2px 2px;

    background:
        linear-gradient(
            180deg,
            rgba(143,164,184,.35),
            rgba(77,96,115,.06)
        );

    box-shadow:
        0 0 20px rgba(113,139,163,.09);
}

/* palace windows */

.windows{
    position:absolute;

    left:50%;
    top:125px;

    transform:translateX(-50%);

    width:400px;
    height:190px;

    display:grid;

    grid-template-columns:repeat(7,1fr);

    gap:18px;

    opacity:.55;
}

.windows span{
    display:block;

    height:65px;

    margin-top:35px;

    background:
        linear-gradient(
            180deg,
            rgba(150,170,188,.25),
            rgba(75,94,111,.04)
        );

    clip-path:polygon(
        50% 0,
        100% 20%,
        100% 100%,
        0 100%,
        0 20%
    );

    box-shadow:
        0 0 16px rgba(120,145,165,.08);
}

/* central entrance */

.entrance{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:120px;
    height:190px;

    border-radius:70px 70px 0 0;

    background:
        radial-gradient(
            ellipse at center bottom,
            rgba(145,161,175,.20),
            rgba(5,8,12,.85) 68%
        );

    border:
        1px solid rgba(135,151,166,.16);
}

/* palace roof */

.roof{
    position:absolute;

    left:50%;
    bottom:340px;

    transform:translateX(-50%);

    width:390px;
    height:180px;

    background:#131b24;

    clip-path:polygon(
        50% 0,
        100% 100%,
        0 100%
    );

    opacity:.85;
}

.roof::after{
    content:"";

    position:absolute;

    left:50%;
    top:28px;

    transform:translateX(-50%);

    width:110px;
    height:90px;

    border-radius:60% 60% 0 0;

    background:#0a0e14;

    border:
        1px solid rgba(145,158,170,.13);
}

/* palace fog */

.palace-fog{
    position:absolute;

    left:-15%;
    right:-15%;
    bottom:-30px;

    height:170px;

    background:
        radial-gradient(
            ellipse at 20% 50%,
            rgba(174,181,188,.16),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 55% 45%,
            rgba(153,163,173,.17),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 85% 55%,
            rgba(168,176,184,.14),
            transparent 35%
        );

    filter:blur(25px);

    animation:palaceFog 12s ease-in-out infinite alternate;
}

@keyframes palaceFog{
    from{
        transform:translateX(-3%);
    }

    to{
        transform:translateX(3%);
    }
}

/* ---------------------------------------------------------
   HERO CONTENT
--------------------------------------------------------- */

.hero-content{
    width:min(850px,90%);

    position:relative;
    z-index:5;

    margin-top:-30px;
}

.eyebrow{
    display:inline-flex;

    align-items:center;
    gap:12px;

    color:#8d9aa6;

    font-size:12px;
    letter-spacing:3px;

    margin-bottom:22px;
}

.eyebrow::before,
.eyebrow::after{
    content:"";

    width:55px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(145,158,171,.35)
        );
}

.eyebrow::after{
    background:
        linear-gradient(
            90deg,
            rgba(145,158,171,.35),
            transparent
        );
}

.hero h1{
    font-size:
        clamp(42px,7vw,76px);

    font-weight:500;

    letter-spacing:2px;

    color:#e4e8eb;

    text-shadow:
        0 4px 35px rgba(0,0,0,.8),
        0 0 40px rgba(110,130,150,.10);

    margin-bottom:16px;
}

.hero h1 span{
    color:#a4b1bd;
}

.hero p{
    max-width:650px;

    margin:0 auto 30px;

    color:#89939d;

    line-height:2;

    font-size:15px;
}

/* mystical symbol */

.mystic-symbol{
    width:78px;
    height:78px;

    margin:0 auto 22px;

    border:1px solid rgba(153,165,177,.25);
    border-radius:50%;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#9aa8b5;

    font-size:26px;

    box-shadow:
        0 0 30px rgba(90,110,130,.10);
}

.mystic-symbol::before{
    content:"";

    position:absolute;

    width:54px;
    height:54px;

    border:1px solid rgba(153,165,177,.15);

    transform:rotate(45deg);
}

.mystic-symbol::after{
    content:"";

    position:absolute;

    width:18px;
    height:18px;

    border:
        1px solid rgba(153,165,177,.20);

    transform:rotate(45deg);
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    padding:12px 25px;

    border-radius:4px;

    cursor:pointer;

    font-size:14px;

    transition:.25s;
}

.btn-primary{
    border:1px solid rgba(148,164,179,.30);

    background:
        linear-gradient(
            135deg,
            rgba(82,101,120,.45),
            rgba(38,49,61,.45)
        );

    color:#e1e5e8;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.btn-primary:hover{
    background:
        linear-gradient(
            135deg,
            rgba(105,125,145,.55),
            rgba(43,55,68,.55)
        );

    transform:translateY(-2px);
}

.btn-secondary{
    border:1px solid rgba(130,143,156,.16);

    background:rgba(10,14,19,.65);

    color:#929ca6;
}

.btn-secondary:hover{
    color:#dce1e5;

    border-color:rgba(140,155,170,.30);

    background:rgba(30,38,47,.55);
}

/* ---------------------------------------------------------
   MAIN
--------------------------------------------------------- */

.container{
    width:min(1250px,92%);

    margin:auto;
}

/* ---------------------------------------------------------
   SECTIONS
--------------------------------------------------------- */

.section{
    padding:65px 0 20px;
}

.section-header{
    display:flex;

    justify-content:space-between;
    align-items:end;

    gap:20px;

    margin-bottom:24px;

    border-bottom:
        1px solid rgba(135,148,160,.10);

    padding-bottom:15px;
}

.section-title{
    font-size:24px;

    font-weight:500;

    color:#dce1e5;
}

.section-title small{
    display:block;

    margin-top:7px;

    color:#68737e;

    font-size:11px;

    letter-spacing:1px;
}

.section-action{
    background:none;
    border:none;

    color:#778695;

    cursor:pointer;

    font-size:13px;
}

.section-action:hover{
    color:#b4c0ca;
}

/* ---------------------------------------------------------
   CATEGORIES
--------------------------------------------------------- */

.categories{
    display:flex;
    gap:9px;

    overflow-x:auto;

    padding-bottom:8px;
}

.categories::-webkit-scrollbar{
    height:4px;
}

.categories::-webkit-scrollbar-thumb{
    background:#28323c;
}

.category{
    white-space:nowrap;

    padding:9px 16px;

    border:1px solid rgba(134,148,162,.12);

    background:rgba(15,20,27,.7);

    color:#7e8994;

    border-radius:3px;

    cursor:pointer;

    transition:.2s;
}

.category:hover{
    color:#cfd6dc;

    border-color:rgba(135,153,170,.28);

    background:rgba(31,40,50,.7);
}

.category.active{
    color:#e0e5e9;

    border-color:rgba(139,158,177,.30);

    background:
        linear-gradient(
            135deg,
            rgba(73,91,108,.30),
            rgba(30,40,50,.45)
        );
}

/* ---------------------------------------------------------
   BOOK GRID
--------------------------------------------------------- */

.library-info{
    color:#68737e;

    font-size:12px;
}

.books-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(185px,1fr)
        );

    gap:22px;
}

/* ---------------------------------------------------------
   BOOK CARD
--------------------------------------------------------- */

.book-card{
    position:relative;

    overflow:hidden;

    border:
        1px solid rgba(130,145,160,.11);

    background:
        linear-gradient(
            145deg,
            rgba(18,24,32,.96),
            rgba(10,14,20,.98)
        );

    border-radius:4px;

    cursor:pointer;

    transition:
        transform .3s,
        border-color .3s,
        box-shadow .3s;
}

.book-card::before{
    content:"";

    position:absolute;
    inset:0;

    border:
        1px solid rgba(160,172,184,.035);

    pointer-events:none;

    z-index:2;
}

.book-card:hover{
    transform:translateY(-6px);

    border-color:
        rgba(139,157,174,.28);

    box-shadow:
        0 18px 45px rgba(0,0,0,.45),
        0 0 25px rgba(83,103,122,.07);
}

.cover{
    height:265px;

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #1b252f,
            #080c11
        );
}

.cover img{
    width:100%;
    height:100%;

    object-fit:cover;

    opacity:.76;

    filter:
        saturate(.45)
        contrast(1.05);

    transition:.4s;
}

.book-card:hover .cover img{
    opacity:.9;
    transform:scale(1.04);
}

.cover::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(5,8,12,.10),
            rgba(5,8,12,.12) 45%,
            rgba(5,8,12,.92)
        );
}

.book-symbol{
    position:absolute;

    left:12px;
    top:12px;

    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid rgba(190,198,205,.20);

    border-radius:50%;

    color:#b2bcc5;

    background:rgba(5,8,12,.55);

    backdrop-filter:blur(5px);

    z-index:4;
}

.favorite{
    position:absolute;

    right:10px;
    top:10px;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid rgba(180,190,200,.15);

    border-radius:50%;

    background:rgba(5,8,12,.60);

    color:#7f8b96;

    cursor:pointer;

    z-index:5;

    transition:.2s;
}

.favorite:hover{
    color:#dce2e6;
    border-color:rgba(180,190,200,.35);
}

.favorite.active{
    color:#d5dde3;

    background:rgba(91,110,128,.30);

    border-color:rgba(150,168,184,.35);
}

.book-info{
    padding:15px;
}

.book-title{
    color:#dce1e5;

    font-size:15px;

    font-weight:600;

    margin-bottom:6px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.book-author{
    color:#707b86;

    font-size:11px;

    margin-bottom:12px;
}

.tags{
    display:flex;

    gap:5px;

    flex-wrap:wrap;
}

.tag{
    color:#7f8b96;

    border:
        1px solid rgba(128,143,157,.11);

    background:rgba(95,110,124,.06);

    padding:4px 7px;

    font-size:9px;

    border-radius:2px;
}

.status{
    position:absolute;

    bottom:12px;
    left:12px;

    z-index:5;

    font-size:9px;

    padding:4px 8px;

    background:rgba(6,9,13,.75);

    border:
        1px solid rgba(140,153,165,.15);

    color:#a1abb4;
}

/* ---------------------------------------------------------
   EMPTY
--------------------------------------------------------- */

.empty{
    text-align:center;

    padding:80px 20px;

    color:#68727c;
}

.empty-icon{
    font-size:40px;

    margin-bottom:15px;

    opacity:.5;
}

/* ---------------------------------------------------------
   MODAL
--------------------------------------------------------- */

.overlay{
    position:fixed;

    inset:0;

    background:
        rgba(2,4,7,.84);

    backdrop-filter:blur(12px);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:200;
}

.overlay.show{
    display:flex;
}

.modal{
    width:min(850px,100%);

    max-height:90vh;

    overflow-y:auto;

    background:
        linear-gradient(
            145deg,
            #111720,
            #090d13
        );

    border:
        1px solid rgba(145,158,170,.18);

    border-radius:5px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);

    position:relative;

    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.98);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.close{
    position:absolute;

    left:18px;
    top:18px;

    width:35px;
    height:35px;

    border:
        1px solid rgba(150,160,170,.15);

    background:rgba(5,8,12,.65);

    color:#87919a;

    border-radius:50%;

    cursor:pointer;

    z-index:10;
}

.close:hover{
    color:#e0e4e7;
}

.modal-content{
    display:grid;

    grid-template-columns:250px 1fr;

    gap:30px;

    padding:35px;
